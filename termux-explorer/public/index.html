<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termux Explorer</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e6e8ee; --dim:#8a92a3; --accent:#4cc38a; --danger:#e5484d; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh }
  header { padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  button { background:#232834; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 11px; font:inherit; cursor:pointer }
  button:hover { border-color:var(--accent) } button.primary { background:var(--accent); color:#06140d; border-color:var(--accent) }
  button.danger { color:var(--danger) }
  input { background:#0b0d11; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit }
  #crumbs { flex:1 1 100%; color:var(--dim); overflow-x:auto; white-space:nowrap }
  #crumbs a { color:var(--accent); cursor:pointer } 
  main { flex:1; display:flex; min-height:0 }
  #list { flex:1; overflow:auto }
  .row { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer }
  .row:hover { background:#161a21 } .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .row .m { color:var(--dim); font-size:12px } .row .acts { display:flex; gap:4px }
  .row .acts button { padding:3px 7px; font-size:13px }
  aside { width:340px; max-width:100%; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:10px; display:none; flex-direction:column; gap:10px }
  aside.open { display:flex }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px }
  .card h4 { margin:0; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em }
  pre { margin:0; background:#0b0d11; padding:8px; border-radius:6px; max-height:220px; overflow:auto; font-size:12px; white-space:pre-wrap }
  #editor { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:5 }
  #editor.open { display:flex } #editor textarea { flex:1; background:#0b0d11; color:var(--fg); border:0; padding:12px; font:13px ui-monospace,monospace; resize:none; outline:0; tab-size:2 }
  #editor header { justify-content:space-between }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--danger); color:#fff; padding:8px 14px; border-radius:8px; display:none; z-index:9 }
  @media (max-width:700px){ main{flex-direction:column} aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:50%} }
</style>
</head>
<body>
<header>
  <button id="up">⬆ Up</button>
  <button id="mkdir">📁 New folder</button>
  <button id="newfile">📄 New file</button>
  <button id="upload">⬆ Upload</button>
  <button id="serveHere" class="primary">▶ Serve this folder</button>
  <button id="panel">⚙ Servers / Runs</button>
  <input id="file" type="file" multiple hidden>
  <div id="crumbs"></div>
</header>
<main>
  <div id="list"></div>
  <aside id="side">
    <div class="card"><h4>Servers</h4><div id="servers"></div></div>
    <div class="card"><h4>Processes</h4><div id="procs"></div></div>
  </aside>
</main>
<div id="editor">
  <header><b id="etitle"></b><span><button id="esave" class="primary">Save</button> <button id="eclose">Close</button></span></header>
  <textarea id="etext" spellcheck="false"></textarea>
</div>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let cwd = '', info = {}, editing = null;
const TEXT = /\.(txt|md|js|mjs|json|html?|css|py|sh|rb|php|pl|lua|ts|tsx|jsx|xml|yml|yaml|toml|ini|cfg|conf|log|csv|env|gitignore)$/i;
const IMG = /\.(png|jpe?g|gif|webp|svg|ico)$/i;
const join = (a, b) => (a ? a + '/' : '') + b;
const enc = encodeURIComponent;

function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); }
async function call(method, url, body, raw) {
  const r = await fetch(url, { method, body: raw ? body : body ? JSON.stringify(body) : undefined, headers: raw ? {} : { 'Content-Type': 'application/json' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || r.statusText); throw new Error(d.error); }
  return d;
}
const size = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

async function load(p = cwd) {
  const d = await call('GET', '/api/list?path=' + enc(p));
  cwd = d.path;
  const parts = cwd ? cwd.split('/') : [];
  $('#crumbs').innerHTML = '<a data-p="">~</a>' + parts.map((s, i) => ' / <a data-p="' + parts.slice(0, i + 1).join('/') + '">' + esc(s) + '</a>').join('');
  $('#list').innerHTML = '';
  for (const it of d.items) {
    const row = document.createElement('div'); row.className = 'row';
    const full = join(cwd, it.name);
    const runnable = !it.dir && info.runners.includes('.' + it.name.split('.').pop().toLowerCase());
    row.innerHTML = `<span>${it.dir ? '📁' : '📄'}</span><span class="n">${esc(it.name)}</span><span class="m">${it.dir ? '' : size(it.size)}</span>
      <span class="acts">${runnable ? '<button data-a="run">Run</button>' : ''}${it.dir ? '<button data-a="serve">Serve</button>' : '<button data-a="dl">⬇</button>'}<button data-a="ren">✎</button><button data-a="del" class="danger">✕</button></span>`;
    row.onclick = (e) => {
      const a = e.target.dataset.a;
      if (!a) return it.dir ? load(full) : open(full, it);
      e.stopPropagation(); action(a, full, it);
    };
    $('#list').append(row);
  }
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function action(a, full, it) {
  if (a === 'del') { if (confirm('Delete ' + it.name + '?')) { await call('POST', '/api/delete', { path: full }); load(); } }
  else if (a === 'ren') { const n = prompt('New name', it.name); if (n && n !== it.name) { await call('POST', '/api/rename', { path: full, name: n }); load(); } }
  else if (a === 'dl') location = '/api/file?dl=1&path=' + enc(full);
  else if (a === 'serve') serve(full);
  else if (a === 'run') { await call('POST', '/api/run', { path: full }); $('#side').classList.add('open'); refreshSide(); }
}

async function open(full, it) {
  if (IMG.test(it.name) || /\.(pdf|mp4|mp3)$/i.test(it.name)) return window.open('/api/file?path=' + enc(full));
  if (!TEXT.test(it.name) && it.size > 2e6) return action('dl', full, it);
  const r = await fetch('/api/file?text=1&path=' + enc(full));
  editing = full; $('#etitle').textContent = full; $('#etext').value = await r.text(); $('#editor').classList.add('open');
}
$('#esave').onclick = async () => { await call('PUT', '/api/file?path=' + enc(editing), $('#etext').value, true); toast2('Saved'); };
$('#eclose').onclick = () => { $('#editor').classList.remove('open'); load(); };
function toast2(m) { const t = $('#toast'); t.style.background = '#2f9e6b'; toast(m); setTimeout(() => t.style.background = '', 3600); }
addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's' && editing && $('#editor').classList.contains('open')) { e.preventDefault(); $('#esave').click(); } });

async function serve(p) {
  const port = prompt('Serve "' + (p || '~') + '" on localhost port:', '3000');
  if (!port) return;
  const d = await call('POST', '/api/serve', { path: p, port: Number(port) });
  window.open(d.url); $('#side').classList.add('open'); refreshSide();
}

async function refreshSide() {
  const [sv, pr] = await Promise.all([call('GET', '/api/servers'), call('GET', '/api/procs')]);
  $('#servers').innerHTML = sv.length ? sv.map((s) => `<div><a href="http://localhost:${s.port}/" target="_blank" style="color:var(--accent)">localhost:${s.port}</a> ← /${esc(s.path)} <button class="danger" data-stop="${s.port}">Stop</button></div>`).join('') : '<span class="m" style="color:var(--dim)">None running</span>';
  $('#procs').innerHTML = pr.length ? pr.slice().reverse().map((p) => `<div><b>${esc(p.cmd)}</b> ${p.running ? '🟢 <button class="danger" data-kill="' + p.id + '">Kill</button>' : '⚪ exit ' + p.code}<pre>${esc(p.log) || '…'}</pre></div>`).join('') : '<span style="color:var(--dim)">None</span>';
}
$('#side').onclick = async (e) => {
  if (e.target.dataset.stop) { await call('POST', '/api/stop', { port: +e.target.dataset.stop }); refreshSide(); }
  if (e.target.dataset.kill) { await call('POST', '/api/kill', { id: +e.target.dataset.kill }); setTimeout(refreshSide, 300); }
};
setInterval(() => { if ($('#side').classList.contains('open')) refreshSide().catch(() => {}); }, 1500);

$('#crumbs').onclick = (e) => { if (e.target.dataset.p !== undefined) load(e.target.dataset.p); };
$('#up').onclick = () => load(cwd.split('/').slice(0, -1).join('/'));
$('#mkdir').onclick = async () => { const n = prompt('Folder name'); if (n) { await call('POST', '/api/mkdir', { path: cwd, name: n }); load(); } };
$('#newfile').onclick = async () => { const n = prompt('File name'); if (n) { await call('POST', '/api/newfile', { path: cwd, name: n }); load(); } };
$('#serveHere').onclick = () => serve(cwd);
$('#panel').onclick = () => { $('#side').classList.toggle('open'); refreshSide(); };
$('#upload').onclick = () => $('#file').click();
$('#file').onchange = async (e) => {
  for (const f of e.target.files) await call('POST', `/api/upload?path=${enc(cwd)}&name=${enc(f.name)}`, f, true);
  e.target.value = ''; load();
};

(async () => { info = await call('GET', '/api/info'); load(''); })();
</script>
</body>
</html>
